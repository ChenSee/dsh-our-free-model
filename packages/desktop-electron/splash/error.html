<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>启动失败</title>
<style>
  body{margin:32px;font:16px/1.7 system-ui;background:#0d1117;color:#edf2f8}
  h1{font-size:22px;color:#00d0c0;margin:0 0 12px}
  p{overflow-wrap:anywhere;margin:0 0 12px}
  small{color:#a8b3c4;display:block;margin-bottom:20px}
  #status{font-size:13px;color:#00d0c0;min-height:20px;margin-bottom:12px}
  .row{display:flex;gap:10px}
  button{flex:1;padding:10px 14px;font:15px system-ui;border-radius:6px;cursor:pointer;border:1px solid transparent}
  #retry{background:#00d0c0;color:#06251f;font-weight:600}
  #retry:hover{background:#2ae0d0}
  #quit{background:transparent;color:#a8b3c4;border-color:#3a4658}
  #quit:hover{color:#edf2f8;border-color:#5a6a7a}
  button[disabled]{opacity:.5;cursor:default}
  code{font-size:13px;background:#161d28;padding:2px 6px;border-radius:4px}
</style>
<h1>本地服务未能启动</h1>
<p id="reason">请检查安装是否完整，以及数据目录是否被另一个独立服务占用。</p>
<small>可从系统托盘退出程序后重试。已有账号和配置会保留。</small>
<p id="status" role="status"></p>
<div class="row">
  <button id="retry" type="button">重试启动</button>
  <button id="quit" type="button">退出程序</button>
</div>
<script>
  // 由主进程在 dom-ready 后桥接 ofmError.retry()/quit()；按钮状态随启动进度更新。
  const status = document.getElementById('status')
  const retry = document.getElementById('retry')
  document.getElementById('quit').addEventListener('click', () => window.ofmError?.quit())
  retry.addEventListener('click', () => { retry.disabled = true; status.textContent = '正在重新启动服务…'; window.ofmError?.retry() })
  window.ofmErrorStatus = (text, busy) => { status.textContent = text; retry.disabled = !!busy }
</script>
