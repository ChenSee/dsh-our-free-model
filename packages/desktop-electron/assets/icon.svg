<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 背板：暖琥珀渐变，呼应插件的流光岁月主题 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf6ec"/>
      <stop offset="0.45" stop-color="#eee2c8"/>
      <stop offset="1" stop-color="#d6c4a0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a86a15"/>
      <stop offset="1" stop-color="#7d4d0c"/>
    </linearGradient>
    <!-- 鱼身：上亮下沉，背腹分明 -->
    <linearGradient id="body" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#f0bd5e"/>
      <stop offset="0.55" stop-color="#dd9a2c"/>
      <stop offset="1" stop-color="#c07f1c"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fbf72" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#5d9455" stop-opacity="0.9"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="60" y="60" width="904" height="904" rx="212"/>
    </clipPath>
  </defs>

  <!-- 背板与柔光 -->
  <g clip-path="url(#squircle)">
    <rect x="60" y="60" width="904" height="904" fill="url(#bg)"/>
    <circle cx="770" cy="250" r="320" fill="#ffffff" opacity="0.4"/>
    <circle cx="250" cy="860" r="380" fill="#7d4d0c" opacity="0.09"/>
  </g>
  <rect x="60" y="60" width="904" height="904" rx="212" fill="none" stroke="url(#rim)" stroke-width="16"/>
  <rect x="90" y="90" width="844" height="844" rx="184" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.6"/>

  <!-- 主体：一条完整的鱼（含分叉尾），腹部以亮色负形区分 -->
  <path d="M222 556
           C 262 408, 480 326, 644 408
           L 868 360
           L 812 520
           L 902 668
           L 670 658
           C 550 766, 330 726, 222 556 Z"
        fill="url(#body)"/>
  <path d="M270 634
           C 358 714, 518 740, 660 672
           C 564 756, 344 734, 270 634 Z"
        fill="url(#belly)"/>
  <!-- 鳃线 -->
  <path d="M400 418 C 372 494, 372 598, 406 680" stroke="#a8690f" stroke-width="13"
        stroke-linecap="round" fill="none" opacity="0.35"/>
  <!-- 鱼眼 -->
  <circle cx="346" cy="540" r="24" fill="#2b2118"/>
  <circle cx="338" cy="532" r="8" fill="#ffffff" opacity="0.92"/>

  <!-- 水纹：暗示鱼缸水位 -->
  <g stroke="#a86a15" stroke-linecap="round" fill="none" opacity="0.3">
    <path d="M182 844 C 296 820, 400 868, 514 844" stroke-width="16"/>
    <path d="M552 858 C 654 836, 734 880, 824 856" stroke-width="12"/>
  </g>

  <!-- 四角星火花：点题「免费 / 即开即用」 -->
  <path d="M248 206 C 260 250, 290 280, 334 292 C 290 304, 260 334, 248 378
           C 236 334, 206 304, 162 292 C 206 280, 236 250, 248 206 Z"
        fill="#c07f1c" opacity="0.55"/>
</svg>
