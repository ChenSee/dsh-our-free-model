name: auto-release

# 上游发版 → 自动出 Windows 桌面安装包，全流程无人值守。
#
# 触发：
# - push 到 main（在 GitHub 上点「Sync fork」会立刻走到这里）
# - 每 30 分钟定时兜底（cron 最小粒度 5 分钟，实际常有延迟）
# - 手动 workflow_dispatch，force 可跳过版本判断（排障用）
#
# 流程：检测上游版本 → 合并上游 main → contributor 测试门禁 + 清单一致性校验 →
# 桌面壳版本对齐 → 推 main → 打 v<版本> 标签 → 触发 build-windows 构建并发布 Release。
#
# 为什么构建要显式触发一次：GITHUB_TOKEN 推 tag 产生的事件不会再创建新的
# workflow run（GitHub 的防递归规则），而 workflow_dispatch 是官方例外。所以这里
# 用 `gh workflow run` 在 tag ref 上触发 build-windows —— 它自己的 tag 触发条件
# 仍然保留，将来换成 PAT 推 tag 时也不会重复构建（gh 触发的那次带同一个 ref，
# 两者只会有一次 run，因为 tag push 根本不会触发）。
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 版本未变也强制走一遍（排障用）
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

# 定时与 push 可能同时到；串行化，避免两次合并/两个同名 tag 撞车。
concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # 本工作流自己推 main 也会触发 push 事件，用 actor 把这一圈挡掉。
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    env:
      UPSTREAM: Ebony-Vinyl/dsh-our-free-model
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # 上游的发布版本就是它根 package.json 的 version；本仓库用桌面壳的 version
      # 追这个号（v2.5.6 / v2.5.7 / v2.5.8 都是这个约定）。只比数字段，够用且不引依赖。
      - name: Detect upstream version
        id: detect
        run: |
          set -euo pipefail
          upstream=$(curl -fsSL --retry 3 "https://raw.githubusercontent.com/${UPSTREAM}/main/package.json" \
            | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          local=$(node -p "require('./packages/desktop-electron/package.json').version")
          echo "upstream=$upstream local=$local"
          newer=$(node -e '
            const cmp = (a, b) => {
              const x = a.split(".").map(Number), y = b.split(".").map(Number)
              for (let i = 0; i < 3; i++) if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) - (y[i] || 0)
              return 0
            }
            console.log(cmp(process.argv[1], process.argv[2]) > 0 ? "yes" : "no")
          ' "$upstream" "$local")
          {
            echo "version=$upstream"
            echo "local=$local"
          } >> "$GITHUB_OUTPUT"
          if [ "$newer" != "yes" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "上游 $upstream 不高于本地 $local，跳过"
            exit 0
          fi
          # 同名标签已经存在就不再发（上游 re-sign 同版本、或上次已发过）。
          if git ls-remote --exit-code --tags origin "refs/tags/v$upstream" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "v$upstream 已存在，跳过"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Merge upstream main
        if: steps.detect.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM}.git" 2>/dev/null || true
          git fetch --no-tags upstream main
          if ! git merge --no-edit upstream/main; then
            echo "::error::与上游合并冲突，未发版。请本地解决冲突后重跑本工作流。"
            git diff --name-only --diff-filter=U | sed 's/^/  冲突文件：/'
            exit 1
          fi

      # 门禁放在打标签之前：发出去的安装包必须过 contributor 全量测试，
      # 并且签名清单要仍然描述当前树（桌面壳的 package.json 不在清单覆盖范围内，
      # 所以版本对齐不会让清单漂移；这里防的是上游带来未签的文件变化）。
      - name: Install root dependencies
        if: steps.detect.outputs.skip != 'true'
        run: npm install --ignore-scripts

      # test:contributor 里有两个套件（standalone-client-regression、
      # standalone-page-lifecycle）通过 packages/standalone 的 esbuild 做隔离构建，
      # 根依赖里没有 esbuild，所以这一步不能省。
      - name: Install standalone dependencies
        if: steps.detect.outputs.skip != 'true'
        run: npm --prefix packages/standalone ci

      - name: Contributor test gate
        if: steps.detect.outputs.skip != 'true'
        run: npm run test:contributor

      - name: Manifest consistency check
        if: steps.detect.outputs.skip != 'true'
        run: npm run manifest:check

      # 两处版本都要对齐：
      # - packages/desktop-electron：安装包自己的版本（exe 文件名、Release 标题）
      # - packages/standalone：管理界面左下角显示的 vX.Y.Z 来自这里
      # 只对齐前者，就会出现「装的是 2.5.8、界面写 2.5.6」。npm version 会同时更新
      # package.json 与 package-lock.json 里的自身版本，且不改动文件格式。
      - name: Align package versions
        if: steps.detect.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.detect.outputs.version }}
        run: |
          set -euo pipefail
          for pkg in packages/desktop-electron packages/standalone; do
            npm --prefix "$pkg" version "$VERSION" --no-git-tag-version --allow-same-version
          done
          if git diff --quiet -- packages/desktop-electron packages/standalone; then
            echo "版本已是 ${VERSION}，无需提交"
          else
            git add packages/desktop-electron/package.json packages/desktop-electron/package-lock.json \
                    packages/standalone/package.json packages/standalone/package-lock.json
            git commit -m "chore(release): 版本号对齐 ${VERSION}（桌面壳 + 独立服务界面）"
          fi

      # release-sign 可能刚往 main 推了重签提交，所以推之前先对齐一次；
      # 仍被拒就重试，最多三次。
      - name: Push main
        if: steps.detect.outputs.skip != 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch origin main
            git merge --no-edit origin/main || {
              echo "::error::与 origin/main 合并冲突，未发版。"
              exit 1
            }
            if git push origin HEAD:main; then exit 0; fi
            echo "第 $attempt 次推送被拒，重试…"
            sleep 5
          done
          echo "::error::main 推送失败，未发版。"
          exit 1

      - name: Tag and push
        if: steps.detect.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.detect.outputs.version }}
        run: |
          set -euo pipefail
          git tag -a "v${VERSION}" -m "Our Free Model ${VERSION}（Windows 桌面安装包，基于上游 v${VERSION} 合并 + 桌面端）"
          git push origin "v${VERSION}"

      # GITHUB_TOKEN 推的 tag 不会触发 build-windows，这里显式触发一次。
      - name: Trigger Windows build
        if: steps.detect.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.detect.outputs.version }}
        run: gh workflow run build-windows.yml --ref "v${VERSION}"

      - name: Summary
        if: always()
        env:
          VERSION: ${{ steps.detect.outputs.version }}
          SKIP: ${{ steps.detect.outputs.skip }}
        run: |
          {
            if [ "$SKIP" = "true" ]; then
              echo "### 跳过：上游版本没有前进，或 v${VERSION} 已发布"
            else
              echo "### 已发版 v${VERSION}"
              echo ""
              echo "Windows 安装包由 build-windows 在 tag \`v${VERSION}\` 上构建，完成后作为 Release 资产上传。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
