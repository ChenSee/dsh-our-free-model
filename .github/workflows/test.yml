name: test

# The required check contexts in ruleset 24626699 are literal strings, including
# the workflow and event labels. Explicit job names must match those contexts;
# GitHub's combined display labels do not change the names reported by each job.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Keep this check required on main. A red result on a source PR means the
  # maintainer still has release preparation to do, not that the author needs
  # access to the publisher's private key.
  release-readiness:
    name: test / release-readiness (pull_request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm run test:release

  # The adapter seam (and only it) is kept under strict TypeScript checking. This
  # job installs development dependencies without running lifecycle scripts.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run typecheck
