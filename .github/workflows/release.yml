name: release

# 手动发版：把当前 main 打成 v<版本> 标签，并出 Windows 桌面安装包。
#
# 为什么不再自动跟上游（2026-10-23 起）：
# 上游会把账号渠道删掉 —— #555 移除两端 WorkBuddy、#577 彻底移除旧产品实现、
# #585 移除华为云 CodeArts，账号渠道从 13 个砍到 10 个。本仓库要保留
# CodeArts / CodeBuddy / WorkBuddy 三条车道，而原先的 auto-release 每 30 分钟
# curl 一次上游版本、并无人值守 `git merge upstream/main`，等于让上游的删除自动
# 覆盖本地的恢复。现在合并上游是人工决定，这个工作流只负责「把当前 main 发出去」：
# 不读上游版本、不 merge upstream、没有定时任务。
#
# 触发：只有 workflow_dispatch（Actions 页面点 Run workflow，或
# `gh workflow run release.yml -R ChenSee/dsh-our-free-model`）。
#
# 版本来源：仓库根 package.json 的 version（不再是上游的 package.json）。
# 想发新版本就先改根 package.json 的 version，再手动跑本工作流。
#
# 流程：读本地版本 → contributor 测试门禁 + 清单一致性校验 → 对齐桌面壳与独立端
# 版本 → 推 main → 打 v<版本> 标签 → 触发 build-windows 构建并发布 Release。
#
# 为什么构建要显式触发一次：GITHUB_TOKEN 推 tag 产生的事件不会再创建新的
# workflow run（GitHub 的防递归规则），而 workflow_dispatch 是官方例外。所以这里
# 用 `gh workflow run` 在 tag ref 上触发 build-windows —— 它自己的 tag 触发条件
# 仍然保留，将来换成 PAT 推 tag 时也不会重复构建（gh 触发的那次带同一个 ref，
# 两者只会有一次 run，因为 tag push 根本不会触发）。
on:
  workflow_dispatch:
    inputs:
      force:
        description: 标签 v<版本> 已存在也强制重发（排障用，会移动标签）
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # 版本只看本仓库根 package.json。同名标签已经存在就不再发（幂等），
      # 需要重发得显式勾 force —— 那时候会移动标签。
      - name: Detect local version
        id: detect
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          echo "local=$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.force }}" != "true" ] \
             && git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "v$version 已存在，跳过（要重发请勾选 force）"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # 门禁放在打标签之前：发出去的安装包必须过 contributor 全量测试，
      # 并且签名清单要仍然描述当前树（桌面壳与独立端的 package.json 不在清单
      # 覆盖范围内，所以版本对齐不会让清单漂移；这里防的是有未重签的文件变化）。
      # 清单漂移时先让 main 上的 release-sign 跑完再发。
      - name: Install root dependencies
        if: steps.detect.outputs.skip != 'true'
        run: npm install --ignore-scripts

      # test:contributor 里有两个套件（standalone-client-regression、
      # standalone-page-lifecycle）通过 packages/standalone 的 esbuild 做隔离构建，
      # 根依赖里没有 esbuild，所以这一步不能省。
      - name: Install standalone dependencies
        if: steps.detect.outputs.skip != 'true'
        run: npm --prefix packages/standalone ci

      - name: Contributor test gate
        if: steps.detect.outputs.skip != 'true'
        run: npm run test:contributor

      - name: Manifest consistency check
        if: steps.detect.outputs.skip != 'true'
        run: npm run manifest:check

      # 两处版本都要对齐：
      # - packages/desktop-electron：安装包自己的版本（exe 文件名、Release 标题）
      # - packages/standalone：管理界面左下角显示的 vX.Y.Z 来自这里
      # 只对齐前者，就会出现「装的是 2.5.8、界面写 2.5.6」。npm version 会同时更新
      # package.json 与 package-lock.json 里的自身版本，且不改动文件格式。
      - name: Align package versions
        if: steps.detect.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.detect.outputs.version }}
        run: |
          set -euo pipefail
          for pkg in packages/desktop-electron packages/standalone; do
            npm --prefix "$pkg" version "$VERSION" --no-git-tag-version --allow-same-version
          done
          if git diff --quiet -- packages/desktop-electron packages/standalone; then
            echo "版本已是 ${VERSION}，无需提交"
          else
            git add packages/desktop-electron/package.json packages/desktop-electron/package-lock.json \
                    packages/standalone/package.json packages/standalone/package-lock.json
            git commit -m "chore(release): 版本号对齐 ${VERSION}（桌面壳 + 独立服务界面）"
          fi

      # release-sign 可能刚往 main 推了重签提交，所以推之前先对齐一次；
      # 仍被拒就重试，最多三次。
      - name: Push main
        if: steps.detect.outputs.skip != 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch origin main
            git merge --no-edit origin/main || {
              echo "::error::与 origin/main 合并冲突，未发版。"
              exit 1
            }
            if git push origin HEAD:main; then exit 0; fi
            echo "第 $attempt 次推送被拒，重试…"
            sleep 5
          done
          echo "::error::main 推送失败，未发版。"
          exit 1

      - name: Tag and push
        if: steps.detect.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.detect.outputs.version }}
        run: |
          set -euo pipefail
          # force 重发时标签可能已存在：先删本地再重建，推送用 --force 覆盖远端。
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            git tag -d "v${VERSION}"
          fi
          git tag -a "v${VERSION}" -m "Our Free Model ${VERSION}（Windows 桌面安装包，含 CodeArts / CodeBuddy / WorkBuddy 渠道）"
          git push --force origin "v${VERSION}"

      # GITHUB_TOKEN 推的 tag 不会触发 build-windows，这里显式触发一次。
      - name: Trigger Windows build
        if: steps.detect.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.detect.outputs.version }}
        # 必须显式 -R：gh 从 git remote 解析仓库，历史上曾命中上游
        # （Ebony-Vinyl）而上游没有 build-windows.yml，导致 HTTP 404。
        # $GITHUB_REPOSITORY 恒等于本工作流所在的 fork（ChenSee），用它钉死目标仓库。
        run: gh workflow run build-windows.yml -R "$GITHUB_REPOSITORY" --ref "v${VERSION}"

      - name: Summary
        if: always()
        env:
          VERSION: ${{ steps.detect.outputs.version }}
          SKIP: ${{ steps.detect.outputs.skip }}
        run: |
          {
            if [ "$SKIP" = "true" ]; then
              echo "### 跳过：v${VERSION} 已发布（需要重发请勾选 force）"
            else
              echo "### 已发版 v${VERSION}"
              echo ""
              echo "Windows 安装包由 build-windows 在 tag \`v${VERSION}\` 上构建，完成后作为 Release 资产上传。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
